[workspace]
resolver = "2"
members  = [
    "crates/nw-core",
    "crates/nw-backend",
    "crates/nw-cloud-protocol",
    "crates/nw-service-protocol",
    "crates/nw-analytics-protocol",
    "crates/nw-analytics-sdk",
    "crates/nw-backup-protocol",
    "crates/nw-backup-client",
    "crates/nw-api",
]
# Vendored, patched LiveKit crate (see [patch] below): not a member.
exclude = ["third_party/webrtc-sys", "third_party/libwebrtc"]

[workspace.package]
version      = "0.1.9"
edition      = "2021"
authors      = ["Neurowatch Contributors"]
license      = "Apache-2.0"
repository   = "https://github.com/ttheekw/Neurowatch"
rust-version = "1.88"
publish      = false

[workspace.dependencies]
# The portal's signed tokens and key list, shared with hosted services.
nw-service-protocol = { path = "crates/nw-service-protocol" }
# Workspace crates
nw-core             = { path = "crates/nw-core" }
nw-backend          = { path = "crates/nw-backend" }
nw-cloud-protocol   = { path = "crates/nw-cloud-protocol" }
nw-analytics-protocol = { path = "crates/nw-analytics-protocol" }
nw-analytics-sdk = { path = "crates/nw-analytics-sdk" }
nw-backup-protocol = { path = "crates/nw-backup-protocol" }
nw-backup-client = { path = "crates/nw-backup-client" }
# Async
tokio               = { version = "1",    features = ["full"] }
# Serialization
serde               = { version = "1",    features = ["derive"] }
serde_json          = "1"
# Error handling
thiserror           = "2"
anyhow              = "1"
# Logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3",  features = ["env-filter", "json"] }
# IDs
uuid                = { version = "1",    features = ["v4", "serde"] }
# At least 0.3.47 (RUSTSEC-2026-0009, stack exhaustion when parsing); needs Rust 1.88.
time                = { version = "0.3.47", features = ["parsing"] }
# GStreamer (0.24 targets GStreamer >= 1.24; system has 1.24.2)
gstreamer           = "0.24"
gstreamer-app       = "0.24"
gstreamer-video     = "0.24"
# Shared memory
memmap2             = "0.9"
# Platform dirs
dirs                = "5"
# Database (V3+). 0.41 bundles a SQLite patched for RUSTSEC-2026-0459; needs Rust 1.88.
# fallible_uint keeps u64 columns as before 0.36 (an error above i64::MAX).
rusqlite            = { version = "0.41", features = ["bundled", "fallible_uint"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.dev]
opt-level = 1

# H.265 browser live view: LiveKit's webrtc-sys with pass-through formats
# always offered (third_party/webrtc-sys/README.md).
[patch."https://github.com/livekit/rust-sdks"]
webrtc-sys = { path = "third_party/webrtc-sys" }
libwebrtc = { path = "third_party/libwebrtc" }
