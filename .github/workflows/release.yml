name: Release

# Tags publish after all package checks pass. Manual runs only build artifacts.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Test build version, for example v0.1.0-rc.1 (no publishing)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${INPUT_VERSION:-${RELEASE_TAG:-$GITHUB_REF_NAME}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || {
            echo 'Expected vMAJOR.MINOR.PATCH, optionally followed by -rc.1'; exit 1;
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Two editions of every package: free (runs up to 16 cameras; published on
  # GitHub Releases) and unlimited (the `unlimited` feature; sold through
  # https://neurowatch.app/downloads, uploaded only to the private bucket).
  package-linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.edition }})
    runs-on: ${{ matrix.runner }}
    needs: version
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        edition: [free, unlimited]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            formats: portable,deb,rpm,arch
          # PySide6 arm64 wheels require glibc 2.39 (Ubuntu 24.04).
          # No Arch package: Arch Linux is x86_64 only.
          - arch: arm64
            runner: ubuntu-24.04-arm
            formats: portable,deb,rpm
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config nasm flex bison curl python3-venv \
            libglib2.0-dev liborc-0.4-dev libopus-dev libpulse-dev libasound2-dev \
            libva-dev libdrm-dev libgudev-1.0-dev libjpeg-dev librtmp-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxv-dev libgl-dev libegl-dev libgles-dev \
            libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-image0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-util1 libxcb-render-util0 libxcb-xkb1 \
            libsoup-3.0-0 glib-networking \
            rpm libarchive-tools zstd dpkg-dev
      - name: Install clang 21 (the cloud's libwebrtc needs it)
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh 21
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build packages
        env:
          PYTHON: python
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          scripts/package_release_linux.sh \
            --version "$RELEASE_VERSION" \
            --arch "${{ matrix.arch }}" \
            --format "${{ matrix.formats }}" \
            --edition "${{ matrix.edition }}" \
            --out-dir dist/release
      - name: Smoke check portable bundle
        env:
          NW_EXPECT_EDITION: ${{ matrix.edition }}
        run: python scripts/smoke_release.py build/release-linux-${{ matrix.arch }}/bundle/neurowatch
      - uses: actions/upload-artifact@v7
        if: matrix.edition == 'free'
        with:
          name: release-linux-${{ matrix.arch }}-${{ matrix.edition }}
          path: dist/release/*
          if-no-files-found: error
      - name: Stage Unlimited packages privately
        if: matrix.edition == 'unlimited'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DOWNLOADS_S3_REGION || 'auto' }}
          S3_ENDPOINT: ${{ secrets.DOWNLOADS_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.DOWNLOADS_S3_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "$S3_BUCKET" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            if [[ "$GITHUB_REPOSITORY" == "ttheekw/Neurowatch" ]]; then
              echo '::error::Configure DOWNLOADS_S3_* secrets before building Unlimited releases'
              exit 1
            fi
            echo '::warning::No private downloads storage: Unlimited artifacts will not be retained'
            exit 0
          fi
          endpoint=()
          [[ -n "$S3_ENDPOINT" ]] && endpoint=(--endpoint-url "$S3_ENDPOINT")
          aws "${endpoint[@]}" s3 cp --recursive --no-progress dist/release/ \
            "s3://$S3_BUCKET/staging/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/unlimited/"

  package-windows:
    name: Windows x86_64 (${{ matrix.edition }})
    runs-on: windows-2022
    needs: version
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        edition: [free, unlimited]
    steps:
      - uses: actions/checkout@v7
      # The Visual Studio developer environment (cl, link, INCLUDE, LIB) for
      # x64, as ilammy/msvc-dev-cmd did (it still runs on the retired Node 20):
      # only the variables VsDevCmd changes are exported.
      - name: Set up MSVC (x64)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the x64 C++ tools was not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $after = cmd /c "`"$devcmd`" -no_logo -arch=amd64 -host_arch=amd64 && set"
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed: $LASTEXITCODE" }
          foreach ($line in $after) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ($name -like 'GITHUB_*' -or $name -like 'RUNNER_*') { continue }
            if ([Environment]::GetEnvironmentVariable($name) -ne $value) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          where.exe cl link
      - name: Install GStreamer (MSVC)
        shell: pwsh
        run: |
          $ver = "1.24.13"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"
          Invoke-WebRequest "$base/gstreamer-1.0-msvc-x86_64-$ver.msi" -OutFile gst-runtime.msi
          Invoke-WebRequest "$base/gstreamer-1.0-devel-msvc-x86_64-$ver.msi" -OutFile gst-devel.msi
          $hashes = @{
            'gst-runtime.msi' = '66915d82adda34189703c36a5d2ef145d2e3afb7afc12c66fcf2ea506e2466d2'
            'gst-devel.msi' = '0afb4394c2cba3999c0f5e74f28c2ac5d98f03131140e09246d4dcd60a0a0395'
          }
          foreach ($msi in @('gst-runtime.msi', 'gst-devel.msi')) {
            if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $hashes[$msi]) { throw "Checksum mismatch: $msi" }
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i $msi /qn /norestart ADDLOCAL=ALL"
            if ($p.ExitCode -notin @(0, 3010)) { throw "$msi failed: $($p.ExitCode)" }
          }
          # The installer records where it put GStreamer in a machine-wide
          # variable that later steps do not inherit; read it, then try the
          # usual locations.
          $candidates = @(
            [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine'),
            "$env:ProgramFiles\gstreamer\1.0\msvc_x86_64",
            "C:\gstreamer\1.0\msvc_x86_64"
          ) | Where-Object { $_ } | ForEach-Object { $_.TrimEnd('\') }
          $gstRoot = $candidates | Where-Object { Test-Path (Join-Path $_ 'bin\gst-launch-1.0.exe') } | Select-Object -First 1
          if (-not $gstRoot) { throw "GStreamer not found after installing; looked in: $($candidates -join ', ')" }
          Write-Host "GStreamer: $gstRoot"
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "$gstRoot\bin" >> $env:GITHUB_PATH
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows installer and zip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: ./scripts/package_windows.ps1 -Version "$env:RELEASE_VERSION" -Edition "${{ matrix.edition }}" -OutDir dist/release
      - name: Test silent install, packaged service and uninstall
        shell: pwsh
        env:
          NW_EXPECT_EDITION: ${{ matrix.edition }}
        run: ./scripts/smoke_windows_installer.ps1 -OutDir dist/release
      - uses: actions/upload-artifact@v7
        if: matrix.edition == 'free'
        with:
          name: release-windows-x86_64-${{ matrix.edition }}
          path: |
            dist/release/*.zip
            dist/release/*-setup.exe
          if-no-files-found: error
      - name: Stage Unlimited packages privately
        if: matrix.edition == 'unlimited'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DOWNLOADS_S3_REGION || 'auto' }}
          S3_ENDPOINT: ${{ secrets.DOWNLOADS_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.DOWNLOADS_S3_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "$S3_BUCKET" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            if [[ "$GITHUB_REPOSITORY" == "ttheekw/Neurowatch" ]]; then
              echo '::error::Configure DOWNLOADS_S3_* secrets before building Unlimited releases'
              exit 1
            fi
            echo '::warning::No private downloads storage: Unlimited artifacts will not be retained'
            exit 0
          fi
          endpoint=()
          [[ -n "$S3_ENDPOINT" ]] && endpoint=(--endpoint-url "$S3_ENDPOINT")
          aws "${endpoint[@]}" s3 cp --recursive --no-progress dist/release/ \
            "s3://$S3_BUCKET/staging/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/unlimited/"

  install-linux:
    name: Install on ${{ matrix.image }} (${{ matrix.arch }})
    needs: package-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'ubuntu:22.04', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'ubuntu:24.04', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:12', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:13', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'fedora:43', format: rpm, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'archlinux:base', format: arch, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'ubuntu:24.04', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {image: 'debian:13', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {image: 'fedora:43', format: rpm, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-linux-${{ matrix.arch }}-free
          path: dist/release
      - name: Install and exercise packaged application in a clean distribution
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
        run: |
          docker run --rm -v "$PWD:/work:ro" "$IMAGE" \
            bash /work/scripts/smoke_linux_package.sh "$FORMAT"

  publish:
    name: Publish GitHub Release
    needs: [version, package-linux, package-windows, install-linux]
    if: (github.event_name == 'push' || github.event_name == 'release') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Gather the free packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-free
          path: dist/release
          merge-multiple: true
      # Version-free copies, for links made before the README's buttons moved
      # to https://neurowatch.app/downloads:
      # https://github.com/<repo>/releases/latest/download/<name>.
      - name: Add version-free download names
        working-directory: dist/release
        run: |
          set -euo pipefail
          declare -A latest=(
            ['neurowatch-*-windows-x86_64-setup.exe']=neurowatch-windows-x86_64-setup.exe
            ['neurowatch-*-windows-x86_64.zip']=neurowatch-windows-x86_64.zip
            ['neurowatch_*_amd64.deb']=neurowatch_amd64.deb
            ['neurowatch_*_arm64.deb']=neurowatch_arm64.deb
            ['neurowatch-*.x86_64.rpm']=neurowatch.x86_64.rpm
            ['neurowatch-*.aarch64.rpm']=neurowatch.aarch64.rpm
            ['neurowatch-*-x86_64.pkg.tar.zst']=neurowatch-x86_64.pkg.tar.zst
            ['neurowatch-*-linux-x86_64.tar.gz']=neurowatch-linux-x86_64.tar.gz
            ['neurowatch-*-linux-arm64.tar.gz']=neurowatch-linux-arm64.tar.gz
          )
          for pattern in "${!latest[@]}"; do
            matches=($pattern)
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}" ]]; then
              echo "expected one file for $pattern, found: ${matches[*]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "${latest[$pattern]}"
          done
          ls -la
      - name: Generate SHA256SUMS
        working-directory: dist/release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Every release, betas included, is marked Latest: the README's
          # download buttons follow GitHub's latest release, which skips
          # pre-releases. The version and title still say beta.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/release/*
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "NeuroWatch $RELEASE_TAG" \
            --notes "Download NeuroWatch (free, up to 16 cameras) or NeuroWatch Unlimited (USD 50 once, no software camera limit; capacity depends on hardware; support response within 24 hours) at https://neurowatch.app/downloads?version=$RELEASE_TAG" \
            --generate-notes \
            --latest \
            dist/release/*

  # The downloads page (https://neurowatch.app/downloads) reads the private
  # bucket: per version a manifest of both editions (free files link to this
  # release on GitHub) and the unlimited packages, handed only to buyers as
  # short-lived signed links. Bucket settings are repository secrets; without
  # them (forks) this job only warns.
  publish-downloads:
    name: Publish to the downloads page
    needs: [version, publish]
    if: (github.event_name == 'push' || github.event_name == 'release') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.DOWNLOADS_S3_REGION || 'auto' }}
      S3_ENDPOINT: ${{ secrets.DOWNLOADS_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.DOWNLOADS_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - name: Gather the free packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-free
          path: dist/free
          merge-multiple: true
      - name: Gather the privately staged Unlimited packages
        run: |
          set -euo pipefail
          mkdir -p dist/unlimited
          if [[ -z "$S3_BUCKET" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            exit 0
          fi
          endpoint=()
          [[ -n "$S3_ENDPOINT" ]] && endpoint=(--endpoint-url "$S3_ENDPOINT")
          aws "${endpoint[@]}" s3 cp --recursive --no-progress \
            "s3://$S3_BUCKET/staging/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/unlimited/" dist/unlimited/
      - name: Upload the unlimited packages, the manifest and the index
        run: |
          if [[ -z "$S3_BUCKET" || -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo '::warning::DOWNLOADS_S3_* secrets are not set: nothing published to the downloads page'
            python3 scripts/release_manifest.py \
              --version "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --free dist/free --unlimited dist/unlimited --out dist/manifest.json
            exit 0
          fi
          endpoint=()
          [[ -n "$S3_ENDPOINT" ]] && endpoint=(--endpoint-url "$S3_ENDPOINT")
          bucket="s3://$S3_BUCKET/releases"
          aws "${endpoint[@]}" s3 cp --no-progress "$bucket/index.json" dist/index-old.json \
            || echo '{"versions": []}' > dist/index-old.json
          python3 scripts/release_manifest.py \
            --version "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --free dist/free --unlimited dist/unlimited --out dist/manifest.json \
            --index-in dist/index-old.json --index-out dist/index.json
          cat dist/manifest.json
          aws "${endpoint[@]}" s3 cp --recursive --no-progress dist/unlimited "$bucket/$RELEASE_TAG/unlimited/"
          aws "${endpoint[@]}" s3 cp --no-progress --content-type application/json \
            dist/manifest.json "$bucket/$RELEASE_TAG/manifest.json"
          # The index last: the page lists a version once its files are there.
          aws "${endpoint[@]}" s3 cp --no-progress --content-type application/json \
            dist/index.json "$bucket/index.json"
