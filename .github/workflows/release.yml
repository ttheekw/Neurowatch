name: Release

# Tags publish after all package checks pass. Manual runs only build artifacts.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Test build version, for example v0.1.0-rc.1 (no publishing)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${INPUT_VERSION:-${RELEASE_TAG:-$GITHUB_REF_NAME}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || {
            echo 'Expected vMAJOR.MINOR.PATCH, optionally followed by -rc.1'; exit 1;
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: version
    timeout-minutes: 90
    env:
      # Official builds include NeuroWatch Cloud: set the NEUROWATCH_CLOUD_TOKEN
      # secret (read-only access to the private cloud repository) and the
      # NEUROWATCH_CLOUD_URL variable. Without the secret (forks) this builds
      # the open-source app.
      OFFICIAL_BUILD: ${{ secrets.NEUROWATCH_CLOUD_TOKEN != '' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            formats: portable,deb,rpm,arch
          # PySide6 arm64 wheels require glibc 2.39 (Ubuntu 24.04).
          # No Arch package: Arch Linux is x86_64 only.
          - arch: arm64
            runner: ubuntu-24.04-arm
            formats: portable,deb,rpm
    steps:
      - uses: actions/checkout@v7
      - name: Check out NeuroWatch Cloud (official builds)
        if: env.OFFICIAL_BUILD == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.NEUROWATCH_CLOUD_REPOSITORY || 'ttheekw/Neurowatch-cloud' }}
          # A release uses the cloud repository's tag of the same version;
          # a manual build, its default branch.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          token: ${{ secrets.NEUROWATCH_CLOUD_TOKEN }}
          path: cloud
      - name: Build with NeuroWatch Cloud (official builds)
        if: env.OFFICIAL_BUILD == 'true'
        env:
          CLOUD_URL: ${{ vars.NEUROWATCH_CLOUD_URL }}
        run: |
          [[ -n "$CLOUD_URL" ]] || { echo 'Set the NEUROWATCH_CLOUD_URL repository variable'; exit 1; }
          # Outside this checkout: the cloud workspace expects this app at
          # Neurowatch/ (its submodule), which links back here.
          cloud="$RUNNER_TEMP/cloud"
          mv cloud "$cloud"
          rm -rf "$cloud/Neurowatch" && ln -s "$GITHUB_WORKSPACE" "$cloud/Neurowatch"
          {
            echo "NW_BACKEND_MANIFEST=$cloud/Cargo.toml"
            echo "NW_BACKEND_PACKAGE=nw-backend-cloud"
            echo "NW_UI_EXTENSION_DIR=$cloud"
            echo "NW_UI_EXTENSION_DIST=neurowatch-cloud"
            echo "NW_UI_EXTENSION_MODULE=neurowatch_cloud"
            echo "NW_CLOUD_ENDPOINT=$CLOUD_URL"
            echo "NW_PACKAGE_LICENSE=AGPL-3.0-or-later AND LicenseRef-NeuroWatch-Cloud"
            echo "NW_EXTRA_LICENSE_FILE=$cloud/LICENSE"
          } >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config nasm flex bison curl python3-venv \
            libglib2.0-dev liborc-0.4-dev libopus-dev libpulse-dev libasound2-dev \
            libva-dev libdrm-dev libgudev-1.0-dev libjpeg-dev librtmp-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxv-dev libgl-dev libegl-dev libgles-dev \
            libsoup-3.0-0 glib-networking \
            rpm libarchive-tools zstd dpkg-dev
      - name: Install clang 21 (official builds; the cloud's libwebrtc needs it)
        if: env.OFFICIAL_BUILD == 'true'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh 21
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build packages
        env:
          PYTHON: python
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          scripts/package_release_linux.sh \
            --version "$RELEASE_VERSION" \
            --arch "${{ matrix.arch }}" \
            --format "${{ matrix.formats }}" \
            --out-dir dist/release
      - name: Smoke check portable bundle
        run: python scripts/smoke_release.py build/release-linux-${{ matrix.arch }}/bundle/neurowatch
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  package-windows:
    name: Windows x86_64
    runs-on: windows-2022
    needs: version
    timeout-minutes: 90
    env:
      # Official builds include NeuroWatch Cloud: set the NEUROWATCH_CLOUD_TOKEN
      # secret (read-only access to the private cloud repository) and the
      # NEUROWATCH_CLOUD_URL variable. Without the secret (forks) this builds
      # the open-source app.
      OFFICIAL_BUILD: ${{ secrets.NEUROWATCH_CLOUD_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out NeuroWatch Cloud (official builds)
        if: env.OFFICIAL_BUILD == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.NEUROWATCH_CLOUD_REPOSITORY || 'ttheekw/Neurowatch-cloud' }}
          # A release uses the cloud repository's tag of the same version;
          # a manual build, its default branch.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          token: ${{ secrets.NEUROWATCH_CLOUD_TOKEN }}
          path: cloud
      - name: Build with NeuroWatch Cloud (official builds)
        if: env.OFFICIAL_BUILD == 'true'
        shell: pwsh
        env:
          CLOUD_URL: ${{ vars.NEUROWATCH_CLOUD_URL }}
        run: |
          if (-not $env:CLOUD_URL) { throw 'Set the NEUROWATCH_CLOUD_URL repository variable' }
          # Outside this checkout: the cloud workspace expects this app at
          # Neurowatch/ (its submodule), which links back here.
          $cloud = Join-Path $env:RUNNER_TEMP 'cloud'
          Move-Item cloud $cloud
          Remove-Item -Recurse -Force (Join-Path $cloud 'Neurowatch') -ErrorAction SilentlyContinue
          New-Item -ItemType Junction -Path (Join-Path $cloud 'Neurowatch') -Target $env:GITHUB_WORKSPACE | Out-Null
          @(
            "NW_BACKEND_MANIFEST=$(Join-Path $cloud 'Cargo.toml')",
            'NW_BACKEND_PACKAGE=nw-backend-cloud',
            "NW_UI_EXTENSION_DIR=$cloud",
            'NW_UI_EXTENSION_DIST=neurowatch-cloud',
            'NW_UI_EXTENSION_MODULE=neurowatch_cloud',
            "NW_CLOUD_ENDPOINT=$env:CLOUD_URL",
            "NW_EXTRA_LICENSE_FILE=$(Join-Path $cloud 'LICENSE')",
            # LiveKit's prebuilt libwebrtc uses the static C runtime (/MT);
            # the whole binary must too, or linking fails (LNK2038).
            'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static'
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The Visual Studio developer environment (cl, link, INCLUDE, LIB) for
      # x64, as ilammy/msvc-dev-cmd did (it still runs on the retired Node 20):
      # only the variables VsDevCmd changes are exported.
      - name: Set up MSVC (x64)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the x64 C++ tools was not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $after = cmd /c "`"$devcmd`" -no_logo -arch=amd64 -host_arch=amd64 && set"
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed: $LASTEXITCODE" }
          foreach ($line in $after) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ($name -like 'GITHUB_*' -or $name -like 'RUNNER_*') { continue }
            if ([Environment]::GetEnvironmentVariable($name) -ne $value) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          where.exe cl link
      - name: Install GStreamer (MSVC)
        shell: pwsh
        run: |
          $ver = "1.24.13"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"
          Invoke-WebRequest "$base/gstreamer-1.0-msvc-x86_64-$ver.msi" -OutFile gst-runtime.msi
          Invoke-WebRequest "$base/gstreamer-1.0-devel-msvc-x86_64-$ver.msi" -OutFile gst-devel.msi
          $hashes = @{
            'gst-runtime.msi' = '66915d82adda34189703c36a5d2ef145d2e3afb7afc12c66fcf2ea506e2466d2'
            'gst-devel.msi' = '0afb4394c2cba3999c0f5e74f28c2ac5d98f03131140e09246d4dcd60a0a0395'
          }
          foreach ($msi in @('gst-runtime.msi', 'gst-devel.msi')) {
            if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $hashes[$msi]) { throw "Checksum mismatch: $msi" }
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i $msi /qn /norestart ADDLOCAL=ALL"
            if ($p.ExitCode -notin @(0, 3010)) { throw "$msi failed: $($p.ExitCode)" }
          }
          # The installer records where it put GStreamer in a machine-wide
          # variable that later steps do not inherit; read it, then try the
          # usual locations.
          $candidates = @(
            [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine'),
            "$env:ProgramFiles\gstreamer\1.0\msvc_x86_64",
            "C:\gstreamer\1.0\msvc_x86_64"
          ) | Where-Object { $_ } | ForEach-Object { $_.TrimEnd('\') }
          $gstRoot = $candidates | Where-Object { Test-Path (Join-Path $_ 'bin\gst-launch-1.0.exe') } | Select-Object -First 1
          if (-not $gstRoot) { throw "GStreamer not found after installing; looked in: $($candidates -join ', ')" }
          Write-Host "GStreamer: $gstRoot"
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "$gstRoot\bin" >> $env:GITHUB_PATH
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows installer and zip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: ./scripts/package_windows.ps1 -Version "$env:RELEASE_VERSION" -OutDir dist/release
      - name: Test silent install, packaged service and uninstall
        shell: pwsh
        run: ./scripts/smoke_windows_installer.ps1 -OutDir dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: |
            dist/release/*.zip
            dist/release/*-setup.exe
          if-no-files-found: error

  install-linux:
    name: Install on ${{ matrix.image }} (${{ matrix.arch }})
    needs: package-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'ubuntu:22.04', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'ubuntu:24.04', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:12', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:13', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'fedora:43', format: rpm, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'archlinux:base', format: arch, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'ubuntu:24.04', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {image: 'debian:13', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {image: 'fedora:43', format: rpm, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release
      - name: Install and exercise packaged application in a clean distribution
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
        run: |
          docker run --rm -v "$PWD:/work:ro" "$IMAGE" \
            bash /work/scripts/smoke_linux_package.sh "$FORMAT"

  publish:
    name: Publish GitHub Release
    needs: [version, package-linux, package-windows, install-linux]
    if: (github.event_name == 'push' || github.event_name == 'release') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Gather artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      # Version-free copies for the README's download buttons, which use
      # https://github.com/<repo>/releases/latest/download/<name>.
      - name: Add version-free download names
        working-directory: dist/release
        run: |
          set -euo pipefail
          declare -A latest=(
            ['neurowatch-*-windows-x86_64-setup.exe']=neurowatch-windows-x86_64-setup.exe
            ['neurowatch-*-windows-x86_64.zip']=neurowatch-windows-x86_64.zip
            ['neurowatch_*_amd64.deb']=neurowatch_amd64.deb
            ['neurowatch_*_arm64.deb']=neurowatch_arm64.deb
            ['neurowatch-*.x86_64.rpm']=neurowatch.x86_64.rpm
            ['neurowatch-*.aarch64.rpm']=neurowatch.aarch64.rpm
            ['neurowatch-*-x86_64.pkg.tar.zst']=neurowatch-x86_64.pkg.tar.zst
            ['neurowatch-*-linux-x86_64.tar.gz']=neurowatch-linux-x86_64.tar.gz
            ['neurowatch-*-linux-arm64.tar.gz']=neurowatch-linux-arm64.tar.gz
          )
          for pattern in "${!latest[@]}"; do
            matches=($pattern)
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}" ]]; then
              echo "expected one file for $pattern, found: ${matches[*]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "${latest[$pattern]}"
          done
          ls -la
      - name: Generate SHA256SUMS
        working-directory: dist/release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Every release, betas included, is marked Latest: the README's
          # download buttons follow GitHub's latest release, which skips
          # pre-releases. The version and title still say beta.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/release/*
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "NeuroWatch $RELEASE_TAG" \
            --generate-notes \
            --latest \
            dist/release/*
