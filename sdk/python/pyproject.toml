[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurowatch-analytics"
version = "0.1.0"
description = "Python analytics plugin SDK for NeuroWatch"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
include = ["neurowatch_analytics*"]
