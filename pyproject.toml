[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "neurowatch"
version         = "0.1.5"
description     = "Neurowatch NVR — Professional video surveillance desktop application"
readme          = "README.md"
requires-python = ">=3.12"
license         = { text = "Apache-2.0" }
dependencies    = [
    "numpy>=2.0",
    "PySide6>=6.7.0",
    "PySide6-Addons>=6.7.0",
]

[project.scripts]
neurowatch-ui = "neurowatch.main:main"

[tool.hatch.build.targets.wheel]
packages = ["ui/neurowatch"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.10",
]

[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["ui"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "RUF"]
# Intentional user-facing typography (RUF001/RUF002/RUF003): "×" for grid
# dimensions, "＋" on add buttons, "–" in prose. Other confusables stay flagged.
allowed-confusables = ["×", "＋", "–"]

[tool.ruff.lint.pep8-naming]
# N802: Qt virtual overrides must keep their camelCase names to be dispatched.
extend-ignore-names = ["*Event", "sizeHint", "mimeData"]

[tool.mypy]
python_version         = "3.12"
ignore_missing_imports = true
warn_return_any        = true
warn_unused_ignores    = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests/ui"]
pythonpath   = ["ui"]
